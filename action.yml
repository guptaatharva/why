name: Why check
description: Run every active Why guard on this change. Guards come from the base branch, code from the PR.
branding:
  icon: shield
  color: green
inputs:
  base:
    description: Trusted ref to take guards and decisions from (defaults to the PR base branch)
    required: false
  version:
    description: why-guard version or git URL to install
    required: false
    default: git+https://github.com/guptaatharva/why.git
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
    - shell: bash
      run: uv tool install "${{ inputs.version }}"
    - shell: bash
      env:
        BASE: ${{ inputs.base || github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      run: |
        git fetch --no-tags --depth=200 origin "+refs/heads/*:refs/remotes/origin/*" || true
        if [ -n "$BASE" ]; then
          status=0
          why check --ref HEAD --base "$BASE" --context pr --no-transitions || status=$?
          # Dependency bumps in this PR (Renovate, Dependabot, agents): run guards before and after.
          # Run from a worktree of the trusted base so the PR cannot edit the guards that judge it.
          git worktree add --quiet --detach "$RUNNER_TEMP/why-base" "$BASE"
          why -C "$RUNNER_TEMP/why-base" upgrade --base "$BASE" --head "$(git rev-parse HEAD)" || status=$?
          exit $status
        else
          why check --no-transitions
        fi
