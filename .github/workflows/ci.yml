name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: uv sync
      - name: "Tests (offline: no model or Tavily calls)"
        run: uv run pytest -q
        env:
          WHY_OFFLINE: "1"
      - name: Upgrade micro-benchmark
        run: uv run python bench/run.py --json bench-result.json
      - name: "Scale check: guard checks on a 50k-line repo stay under 5 minutes"
        run: uv run python bench/scale.py --json scale-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: |
            bench-result.json
            scale-result.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
