[project]
name = "why-guard"
version = "0.1.0"
description = "Why turns the decisions behind agent-written code into executable guards."
readme = "README.md"
authors = [{ name = "Atharva Gupta" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.8",
    "pytest>=8.0",
    "mcp>=1.2",
]

[project.scripts]
why = "why.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "why"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
